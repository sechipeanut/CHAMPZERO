    <!-- Bespoke Esports Fonts -->

    <style>
        :root {
            --cz-gold: #FFD700;
            --cz-gold-light: #FFF099;
            --cz-gold-glow: rgba(255, 215, 0, 0.1);
            --cz-bg: #000000;
            --cz-surface: #0A0A0E;
            --cz-card: #111116;
            --cz-border: rgba(255, 255, 255, 0.08);

            /* Compatibility tokens */
            --gold: #FFD700;
            --gold-light: #FFF099;
            --gold-darker: #C99700;
            --dark-bg: #000000;
            --dark-card: #111116;
        }

        html, body {
            background-color: #000000 !important;
            color: #FFFFFF;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000 !important;
            color: #FFFFFF;
            overflow: hidden;
        }

        .font-heading {
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: -0.02em;
        }

        .font-mono-tag {
            font-family: 'Space Mono', monospace;
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(6rem, 15vw, 9rem);
            font-weight: 800;
            color: var(--cz-gold);
            letter-spacing: -5px;
            line-height: 0.9;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(80px, 9999px, 10px, 0); }
            40% { clip: rect(40px, 9999px, 80px, 0); }
            60% { clip: rect(20px, 9999px, 60px, 0); }
            80% { clip: rect(70px, 9999px, 30px, 0); }
            100% { clip: rect(100px, 9999px, 90px, 0); }
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen text-center p-6 relative selection:bg-[#FFD700] selection:text-black">
    
    <!-- AMBIENT GLOW -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#FFD700]/5 rounded-full blur-[140px]"></div>
    </div>

    <div class="relative z-10 max-w-lg mx-auto">
        <div class="glitch mb-2" data-text="404">404</div>
        <h1 class="font-heading font-bold text-2xl sm:text-4xl text-white uppercase tracking-tight mb-3">
            Map Not Found
        </h1>
        <p class="text-xs sm:text-sm text-neutral-400 max-w-md mx-auto mb-8 leading-relaxed">
            You've ventured into the fog of war. The requested coordinates do not exist or have been relocated on our servers.
        </p>
        
        <a href="/"
            class="font-heading font-bold text-xs uppercase tracking-wider bg-[#FFD700] text-black px-8 py-3.5 rounded-lg hover:bg-[#FFF099] transition-all shadow-lg shadow-yellow-500/10 inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Return to Base
        </a>
    </div>

</body>
