[build]
  command = "node scripts/build-config.js"
  publish = "."
  functions = "netlify/functions"

# ------------------------------------------------------------------------------
# SECURITY HEADERS
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://js.payrex.com https://js.payrexhq.com https://*.payrexhq.com https://static.payrex.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://cdn.tailwindcss.com https://static.cloudflareinsights.com https://*.google.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://firebasestorage.googleapis.com https://image.mux.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.gstatic.com https://*.google-analytics.com https://*.analytics.google.com https://*.googlesyndication.com https://cloudflareinsights.com https://*.cloudflareinsights.com https://api.payrex.com https://api.payrexhq.com https://*.payrexhq.com https://stream.mux.com; frame-src 'self' https://js.payrex.com https://js.payrexhq.com https://checkout.payrex.com https://*.payrexhq.com https://accounts.google.com https://*.google.com https://googleads.g.doubleclick.net https://*.googlesyndication.com; media-src 'self' blob: https://stream.mux.com;"

# ------------------------------------------------------------------------------
# SOURCE ISOLATION & SENSITIVE FILE BLOCKING (Fail-Closed 404)
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scratch/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ARCHITECTURE.txt"
  to = "/404.html"
  status = 404
  force = true

# ------------------------------------------------------------------------------
# API SERVERLESS PROXIES
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/firebase-config"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/functions/firebase-config"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ------------------------------------------------------------------------------
# APPLICATION ROUTING
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false