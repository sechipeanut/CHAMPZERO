<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChampZero — Partners</title>

    <meta name="description"
        content="Meet the strategic partners, sponsors, and community alliances powering the ChampZero esports ecosystem.">
    <meta property="og:title" content="ChampZero — Partners">
    <meta property="og:description" content="Collaborating with leading brands to power the future of esports.">
    <meta property="og:image" content="https://champzero.com/pictures/cz_logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --gold-darker: #C99700;
            --dark-bg: #111115;
            --dark-card: #1A1A1F;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Nav Links */
        .nav-link {
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--gold);
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }

        .nav-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Focus Accessibility */
        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
            border-radius: 4px;
        }

        .text-glow {
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .futuristic-bg {
            background-color: var(--dark-bg);
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>

<body class="bg-[var(--dark-bg)] text-gray-200 antialiased">

    <div id="header-placeholder" style="position: sticky; top: 0; z-index: 50;"></div>

    <main>
        <section class="relative futuristic-bg text-white overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-[var(--dark-bg)] to-transparent"></div>
            <div class="relative max-w-7xl mx-auto px-6 sm:px-8 py-40 text-center">
                <h1 class="text-5xl md:text-7xl font-extrabold text-glow text-[var(--gold)]">Strategic Alliances</h1>
                <p class="mt-4 text-lg md:text-xl text-gray-300 max-w-3xl mx-auto">We are proud to collaborate with
                    leading brands and organizations to power the future of esports.</p>
            </div>
        </section>

        <div class="py-24 bg-[var(--dark-bg)]">
            <div id="partners-container" class="max-w-7xl mx-auto px-6 sm:px-8 space-y-20">
            </div>
        </div>

        <section class="futuristic-bg py-24">
            <div
                class="max-w-4xl mx-auto text-center bg-gradient-to-r from-yellow-600/10 via-[var(--dark-card)] to-yellow-600/10 border border-[var(--gold)]/20 p-10 rounded-xl">
                <h2 class="text-3xl font-bold mb-4 text-white">Partner with ChampZero</h2>
                <p class="text-lg text-gray-300 mb-6 max-w-2xl mx-auto">Connect your brand with thousands of engaged
                    esports fans and players through our tournaments, events, and talent platform.</p>
                <a href="/contact?subject=Partnership Inquiry"
                    class="bg-gradient-to-r from-[var(--gold-darker)] to-[var(--gold)] text-black font-extrabold px-8 py-3 rounded-full shadow-lg shadow-[var(--gold)]/20 hover:scale-105 transform transition-all duration-300 inline-block">
                    Become a Partner
                </a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/partners.js"></script>
    <script type="module" src="js/notifications.js"></script>

</body>

</html>
