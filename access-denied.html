    <style>
        :root {
            --cz-gold: #FFD700;
            --cz-gold-light: #FFF099;
            --cz-bg: #000000;
            --cz-surface: #0A0A0E;
            --cz-card: #111116;
            --cz-border: rgba(255, 255, 255, 0.08);

            /* Compatibility tokens */
            --gold: #FFD700;
            --gold-light: #FFF099;
            --gold-darker: #C99700;
            --dark-bg: #000000;
            --dark-card: #111116;
        }

        html, body {
            background-color: #000000 !important;
            color: #FFFFFF;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000 !important;
            color: #FFFFFF;
            overflow: hidden;
        }

        .font-heading {
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: -0.02em;
        }

        .font-mono-tag {
            font-family: 'Space Mono', monospace;
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 800;
            color: #EF4444;
            letter-spacing: -4px;
            line-height: 0.9;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #DC2626;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #991B1B;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(80px, 9999px, 10px, 0); }
            40% { clip: rect(40px, 9999px, 80px, 0); }
            60% { clip: rect(20px, 9999px, 60px, 0); }
            80% { clip: rect(70px, 9999px, 30px, 0); }
            100% { clip: rect(100px, 9999px, 90px, 0); }
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
    </style>
    <link rel="stylesheet" href="css/custom-cursor.css">
</head>

<body class="flex flex-col items-center justify-center min-h-screen text-center p-6 relative selection:bg-red-500 selection:text-black">
    
    <!-- AMBIENT RED GLOW -->
    <div class="absolute inset-0 z-0 pointer-events-none">

    </div>

    <div class="relative z-10 max-w-lg mx-auto">
        <!-- LOCK ICON -->
        <div class="mb-6 relative inline-block">
            <div class="absolute inset-0 bg-red-500/20 rounded-full blur-xl pulse-ring"></div>
            <div class="relative bg-red-950/40 p-6 rounded-2xl border border-red-500/30 shadow-2xl">
                <svg class="w-12 h-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
        </div>

        <div class="glitch mb-2" data-text="403">403</div>
        <h1 class="font-heading font-bold text-2xl sm:text-3xl text-white uppercase tracking-tight mb-3">
            Access Restricted
        </h1>
        <p class="text-xs sm:text-sm text-neutral-400 max-w-md mx-auto mb-6 leading-relaxed">
            Your clearance level is insufficient to access this operational sector or tournament administration panel.
        </p>

        <div class="bg-[#0A0A0E] border border-red-500/20 rounded-xl p-4 mb-8 text-left">
            <div class="flex items-start gap-3">
                <div class="w-2 h-2 rounded-full bg-red-500 mt-1.5 flex-shrink-0 animate-ping"></div>
                <div>
                    <p class="font-mono-tag text-xs text-red-400 font-bold uppercase tracking-wider">Authorization Required</p>
                    <p class="text-[11px] text-neutral-400 mt-0.5">If you believe this is an error, please verify your login credentials or reach out to tournament admins.</p>
                </div>
            </div>
        </div>
        
        <div class="flex flex-wrap gap-3 justify-center">
            <a href="/"
                class="font-heading font-bold text-xs uppercase tracking-wider bg-[#FFD700] text-black px-6 py-3 rounded-lg hover:bg-[#FFF099] transition-all shadow-lg shadow-yellow-500/10">
                Return Home
            </a>
            <a href="/profile"
                class="font-heading font-bold text-xs uppercase tracking-wider bg-white/5 border border-white/10 text-white px-6 py-3 rounded-lg hover:bg-white/10 hover:border-[#FFD700]/30 transition-all">
                My Profile
            </a>
        </div>
    </div>

</body>

</html>
