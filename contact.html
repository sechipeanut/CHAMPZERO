<!doctype html>
<html lang="en" class="scroll-smooth">

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChampZero — Contact Us</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --gold: #FFD700;
      --gold-darker: #C99700;
      --dark-bg: #111115;
      --dark-card: #1A1A1F;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    .text-glow {
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .futuristic-bg {
      background-color: var(--dark-bg);
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .nav-link {
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 100%;
      transform: scaleX(0);
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--gold);
      transform-origin: bottom right;
      transition: transform 0.25s ease-out;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    .dark-input,
    .dark-select {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .dark-input:focus,
    .dark-select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.3);
    }

    .dark-select option {
      background-color: var(--dark-card);
      color: white;
    }
  </style>
</head>

<body class="bg-[var(--dark-bg)] text-gray-200 antialiased">

  <div id="header-placeholder" style="position: sticky; top: 0; z-index: 50;"></div>

  <main>
    <section class="relative futuristic-bg text-white overflow-hidden">
      <img src="https://images.unsplash.com/photo-1587560699334-cc426240169f?auto=format&fit=crop&w=1600&q=80"
        class="absolute inset-0 w-full h-full object-cover opacity-10" alt="Contact abstract background">
      <div class="absolute inset-0 bg-gradient-to-t from-[var(--dark-bg)] to-transparent"></div>
      <div class="relative max-w-7xl mx-auto px-6 sm:px-8 py-40 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold text-glow text-[var(--gold)]">Get In Touch</h1>
        <p class="mt-4 text-lg md:text-xl text-gray-300 max-w-3xl mx-auto">Have questions? We're here to help.</p>
      </div>
    </section>

    <div class="py-24 bg-[var(--dark-bg)]">
      <div class="max-w-6xl mx-auto px-6 sm:px-8">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-10">
          <div class="md:col-span-3 bg-[var(--dark-card)] border border-white/10 p-8 rounded-xl">
            <h2 class="text-2xl font-bold mb-6 text-white">Send Us a Message</h2>
            <form id="contactForm" class="space-y-4">
              <div>
                <label for="name" class="block text-sm font-medium text-gray-300">Full Name</label>
                <input id="name" name="name" type="text" required
                  class="dark-input mt-1 block w-full p-3 rounded-md shadow-sm">
              </div>
              <div>
                <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
                <input id="email" name="email" type="email" required
                  class="dark-input mt-1 block w-full p-3 rounded-md shadow-sm">
              </div>
              <div>
                <label for="subject" class="block text-sm font-medium text-gray-300">Subject</label>
                <select id="subject" name="subject" required
                  class="dark-select mt-1 block w-full p-3 rounded-md shadow-sm">
                  <option value="">Select a subject</option>
                  <option value="General Inquiry">General Inquiry</option>
                  <option value="Tournament Support">Tournament Support</option>
                  <option value="Partnership Inquiry">Partnership Inquiry</option>
                </select>
              </div>
              <div>
                <label for="message" class="block text-sm font-medium text-gray-300">Message</label>
                <textarea id="message" name="message" rows="4" required
                  class="dark-input mt-1 block w-full p-3 rounded-md shadow-sm"></textarea>
              </div>
              <div>
                <button type="submit"
                  class="w-full bg-gradient-to-r from-[var(--gold-darker)] to-[var(--gold)] text-black font-bold py-3 px-4 rounded-md shadow-lg shadow-[var(--gold)]/20 hover:opacity-90 transition disabled:opacity-50">Send
                  Message</button>
              </div>
            </form>
          </div>

          <div class="md:col-span-2 space-y-8">
            <div class="bg-[var(--dark-card)] border border-white/10 p-6 rounded-xl">
              <h2 class="text-xl font-bold mb-4 text-white">Contact Details</h2>
              <div class="space-y-4">
                <div class="flex items-start gap-4">
                  <div class="bg-white/5 p-2 rounded-md"><svg xmlns="http://www.w3.org/2000/svg"
                      class="h-6 w-6 text-[var(--gold)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg></div>
                  <div>
                    <h3 class="font-semibold text-white">Email Support</h3>
                    <a href="mailto:business.champzero@gmail.com"
                      class="text-[var(--gold)] font-medium text-sm hover:underline break-all">business.champzero@gmail.com</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/contact.js"></script>
  <script type="module" src="js/notifications.js"></script>

</body>

</html>
