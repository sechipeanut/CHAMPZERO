<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <!-- Google tag (gtag.js) -->

      window.dataLayer = window.dataLayer || [];

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5161743455178808"
     crossorigin="anonymous"></script>   
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>ChampZero — Password Recovery</title>
    <meta name="description" content="Reset your ChampZero account password securely.">
    <meta property="og:title" content="ChampZero — Password Recovery">
    <meta property="og:description" content="Reset your ChampZero account password.">
    <meta property="og:image" content="https://champzero.com/pictures/cz_logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bespoke Esports Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700;1,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cz-gold: #FFD700;
            --cz-gold-light: #FFF099;
            --cz-gold-glow: rgba(255, 215, 0, 0.08);
            --cz-bg: #000000;
            --cz-surface: #0A0A0E;
            --cz-card: #111116;
            --cz-border: rgba(255, 255, 255, 0.08);
            --cz-border-gold: rgba(255, 215, 0, 0.3);

            /* Compatibility tokens */
            --gold: #FFD700;
            --dark-bg: #000000;
            --dark-card: #111116;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--cz-bg);
            color: #FFFFFF;
            overflow-x: hidden;
        }

        .font-heading {
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: -0.02em;
        }

        .font-mono-tag {
            font-family: 'Space Mono', monospace;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% -15%, rgba(255, 215, 0, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
        }

        .dark-input {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--cz-border);
            color: #fff;
            transition: all 0.2s ease;
        }

        .dark-input:focus {
            outline: none;
            border-color: var(--cz-border-gold);
            box-shadow: 0 0 15px var(--cz-gold-glow);
        }

        :focus-visible {
            outline: 2px solid var(--cz-gold);
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col justify-between selection:bg-[#FFD700] selection:text-black ambient-glow">

    <!-- HEADER MINIMAL -->
    <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/5 h-16 flex items-center justify-between px-6 max-w-6xl mx-auto w-full">
        <a href="/" class="flex items-center gap-2.5 group">
            <img src="pictures/cz_logo.png" alt="ChampZero Logo" class="w-7 h-7 object-contain">
            <span class="font-heading font-bold text-base text-white group-hover:text-[#FFD700] transition-colors">ChampZero</span>
        </a>
        <a href="/login" class="text-xs font-semibold text-neutral-400 hover:text-white transition-colors">
            ← Back to Login
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md bg-[#0A0A0E] p-8 sm:p-10 rounded-2xl shadow-2xl border border-white/10 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-[#FFD700]/5 via-transparent to-transparent pointer-events-none"></div>

            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl bg-[#FFD700]/10 border border-[#FFD700]/20 text-[#FFD700] flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <h1 class="font-heading font-bold text-2xl sm:text-3xl text-white uppercase tracking-tight">Reset Password</h1>
                <p class="text-xs text-neutral-400 mt-2 leading-relaxed">
                    Enter your registered email address and we'll transmit a secure recovery link.
                </p>
            </div>

            <form id="resetForm" class="space-y-5">
                <div>
                    <label for="reset-email" class="block font-semibold text-neutral-300 text-xs uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" id="reset-email" required placeholder="player@champzero.org"
                        class="dark-input w-full p-3 rounded-lg text-sm text-white placeholder-neutral-500">
                </div>

                <button type="submit"
                    class="w-full font-heading font-bold text-xs uppercase tracking-wider bg-[#FFD700] text-black py-3.5 px-4 rounded-lg shadow-lg shadow-yellow-500/10 hover:bg-[#FFF099] transition-all cursor-pointer">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="/login" class="text-xs font-mono-tag text-neutral-400 hover:text-[#FFD700] transition-colors">
                    ← Back to Log In
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER MINIMAL -->
    <footer class="border-t border-white/5 bg-black/60 py-4 text-center font-mono-tag text-[10px] text-neutral-500 uppercase tracking-wider">
        © 2026 ChampZero Platform. All rights reserved.
    </footer>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            
            btn.disabled = true;
            btn.textContent = "SENDING LINK...";

            try {
                await sendPasswordResetEmail(auth, email, {
                    url: window.location.origin + '/login',
                    handleCodeInApp: false
                });
                showSuccessToast("Success!", "Check your email inbox. A password recovery link has been dispatched.", 3000);
                setTimeout(() => window.location.href = "/login", 1800);
            } catch (error) {
                console.error(error);
                let msg = "Failed to send reset email.";
                if(error.code === 'auth/user-not-found') msg = "No player account found with this email.";
                showErrorToast("Error", msg, 4000);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
    <script src="js/toast.js"></script>
</body>

</html>
