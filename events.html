<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChampZero — Events</title>

    <meta name="description" content="Join ChampZero community events, watch parties, and special broadcasts.">
    <meta property="og:title" content="ChampZero — Events">
    <meta property="og:description" content="Explore watch parties, community nights, and special broadcasts.">
    <meta property="og:image" content="https://champzero.com/pictures/cz_logo.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mux Player -->
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --gold-darker: #C99700;
            --dark-bg: #111115;
            --dark-card: #1A1A1F;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .text-glow {
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .futuristic-bg {
            background-color: var(--dark-bg);
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Nav Links */
        .nav-link {
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--gold);
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }

        .nav-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Form Elements */
        .dark-input,
        .dark-select {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .dark-input:focus,
        .dark-select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.3);
        }

        /* Focus Accessibility */
        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-[var(--dark-bg)] text-gray-200 antialiased futuristic-bg">

    <div id="header-placeholder" style="position: sticky; top: 0; z-index: 50;"></div>

    <main class="max-w-7xl mx-auto px-6 sm:px-8 py-12">
        <section class="text-center mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold text-glow text-[var(--gold)]">Community & Live Events</h1>
            <p class="mt-4 text-lg text-gray-300 max-w-2xl mx-auto">Explore watch parties, community nights, and special
                broadcasts from the ChampZero ecosystem.</p>
            <div id="admin-action-area" class="mt-8 min-h-[50px]"></div>
        </section>

        <section id="liveMatchesSection" class="mb-16 hidden">
            <div class="flex items-center gap-3 mb-8">
                <span class="relative flex h-3 w-3">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
                <h2 class="text-3xl font-bold text-white">Live Matches</h2>
            </div>

            <div id="liveMatchGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            </div>
        </section>

        <section id="eventGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center text-gray-500 py-12">Loading events...</div>
        </section>
    </main>

    <div id="detailsModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div
            class="bg-[var(--dark-card)] border border-white/10 rounded-xl w-full md:w-2/3 lg:w-1/2 p-6 relative max-h-[90vh] overflow-auto shadow-2xl">
            <div id="detailBanner" class="mb-4"></div>
            <h3 id="detailTitle" class="text-3xl font-bold mb-2 text-white"></h3>
            <div id="detailMeta" class="mb-4 text-sm text-gray-300 flex flex-wrap gap-x-6 gap-y-2"></div>
            <div class="border-t border-white/10 my-4"></div>
            <div id="detailDesc" class="mb-6 text-gray-300 leading-relaxed"></div>
            <div id="detailActions" class="flex gap-4"></div>
            <button onclick="closeModal('detailsModal')" aria-label="Close modal"
                class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-2xl">&times;</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/events.js"></script>
    <script type="module" src="js/notifications.js"></script>

</body>

</html>
