<header id="main-header"
    class="sticky top-0 z-50 bg-[var(--dark-bg)]/95 backdrop-blur-lg border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
        <a href="/" class="flex items-center gap-3">
            <img src="pictures/cz_logo.png" alt="ChampZero Logo" class="w-10 h-10 rounded-md object-cover">
            <span class="font-bold text-xl text-white">ChampZero</span>
            <span class="bg-[var(--gold)] text-black text-[10px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider vertical-align-middle">
            Beta
            </span>
        </a>
        <nav class="hidden md:flex items-center gap-8 text-sm">
            <a href="/"          class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Home</a>
            <a href="/tournaments" class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Tournaments</a>
            <a href="/events"    class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Events</a>
            <a href="/teams"     class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Teams &amp; Recruitment</a>
            <a href="/rising"    class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Rising Champ</a>
            <a href="/partners"  class="nav-link text-gray-300 hover:text-[var(--gold)] transition-colors">Partners</a>
        </nav>
        <div class="flex items-center gap-3">
            <div id="auth-controls-wrapper"
                class="transition-opacity duration-500 opacity-0 pointer-events-none md:min-w-[200px] md:flex md:justify-end">
                <div class="relative">
                    <div id="auth-controls" class="flex items-center gap-3">
                        <a href="login.html"
                            class="text-sm px-3 py-1.5 rounded-md hover:bg-white/10 text-gray-300">Log In</a>
                        <a href="signup.html"
                            class="hidden sm:inline-block bg-gradient-to-r from-[var(--gold-darker)] to-[var(--gold)] text-black px-4 py-2 rounded-md text-sm font-bold">Sign Up</a>
                    </div>
                </div>
            </div>
            <button id="mobile-menu-button" aria-label="Toggle navigation menu"
                class="md:hidden p-2 rounded-md text-gray-300 hover:bg-white/10 cursor-pointer pointer-events-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<div id="mobile-menu"
    class="hidden md:hidden fixed inset-0 bg-[var(--dark-bg)] z-[100] p-6 transition-all duration-300">
    <div class="flex justify-end mb-4">
        <button id="close-mobile-menu" class="text-gray-400 hover:text-white">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <nav class="flex flex-col items-center justify-center h-[80%] gap-6 text-lg">
        <a href="/"            class="text-gray-300 hover:text-[var(--gold)]">Home</a>
        <a href="/tournaments" class="text-gray-300 hover:text-[var(--gold)]">Tournaments</a>
        <a href="/events"      class="text-gray-300 hover:text-[var(--gold)]">Events</a>
        <a href="/teams"       class="text-gray-300 hover:text-[var(--gold)]">Teams &amp; Recruitment</a>
        <a href="/rising"      class="text-gray-300 hover:text-[var(--gold)]">Rising Champ</a>
        <a href="/partners"    class="text-gray-300 hover:text-[var(--gold)]">Partners</a>
        <div class="border-t border-white/20 mt-6 pt-6 flex gap-4 w-full justify-center">
            <a href="login.html"
                class="text-sm px-6 py-2 rounded-md text-gray-300 ring-1 ring-gray-600 hover:bg-white/5">Log in</a>
            <a href="signup.html"
                class="bg-gradient-to-r from-[var(--gold-darker)] to-[var(--gold)] text-black px-6 py-2 rounded-md text-sm font-bold hover:opacity-90">Sign Up</a>
        </div>
    </nav>
</div>
