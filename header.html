<header id="main-header"
    class="sticky top-0 z-50 bg-black/95 backdrop-blur-md border-b border-white/5 transition-all duration-300">
    <div class="max-w-6xl mx-auto px-6 h-18 flex justify-between items-center py-4">
        
        <!-- BRAND IDENTITY -->
        <a href="/" class="flex items-center gap-2.5 group">
            <img src="pictures/cz_logo.png" 
                 alt="ChampZero Logo" 
                 class="w-7 h-7 object-contain">
            <div class="flex items-center gap-1.5">
                <span class="font-heading font-bold text-base tracking-tight text-white group-hover:text-[#FFD700] transition-colors">ChampZero</span>
                <span class="font-mono-tag bg-[#FFD700] text-black text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">
                    Beta
                </span>
            </div>
        </a>

        <!-- DESKTOP NAV -->
        <nav class="hidden md:flex items-center gap-7 text-xs font-semibold uppercase tracking-wider text-neutral-400">
            <a href="/"          class="nav-link hover:text-white transition-colors">Home</a>
            <a href="/tournaments" class="nav-link hover:text-white transition-colors">Tournaments</a>
            <a href="/events"    class="nav-link hover:text-white transition-colors">Events</a>
            <a href="/teams"     class="nav-link hover:text-white transition-colors">Teams &amp; Recruitment</a>
            <a href="/rising"    class="nav-link hover:text-white transition-colors">Rising Champ</a>
            <a href="/partners"  class="nav-link hover:text-white transition-colors">Partners</a>
        </nav>


        <!-- AUTH CONTROLS -->
        <div class="flex items-center gap-3">
            <div id="auth-controls-wrapper"
                class="transition-opacity duration-500 opacity-0 pointer-events-none md:min-w-[180px] md:flex md:justify-end">
                <div class="relative">
                    <div id="auth-controls" class="flex items-center gap-2">
                        <a href="/login"
                            class="text-xs font-semibold px-3 py-1.5 rounded-lg text-neutral-300 hover:text-white transition-colors">Log In</a>
                        <a href="/signup"
                            class="hidden sm:inline-block font-heading font-bold text-xs uppercase tracking-wider bg-[#FFD700] hover:bg-[#FFF099] text-black px-4 py-2 rounded-lg transition-all shadow-sm">Sign Up</a>
                    </div>
                </div>
            </div>
            <button id="mobile-menu-button" aria-label="Toggle navigation menu"
                class="md:hidden p-2 rounded text-neutral-400 hover:text-white hover:bg-white/5 border border-white/10 cursor-pointer pointer-events-auto transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<div id="mobile-menu"
    class="hidden md:hidden fixed inset-0 bg-black/98 backdrop-blur-2xl z-[100] p-6 transition-all duration-300 flex flex-col justify-between">

            <div class="flex items-center gap-2.5">
                <img src="pictures/cz_logo.png" class="w-7 h-7 object-contain" alt="Logo">
                <span class="font-heading font-bold text-white text-base">ChampZero</span>
            </div>
            <button id="close-mobile-menu" class="p-2 text-neutral-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col gap-4 text-base font-semibold mt-8">
            <a href="/"            class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Home</a>
            <a href="/tournaments" class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Tournaments</a>
            <a href="/events"      class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Events</a>
            <a href="/teams"       class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Teams &amp; Recruitment</a>
            <a href="/rising"      class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Rising Champ</a>
            <a href="/partners"    class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Partners</a>
        </nav>
    </div>
    <div class="space-y-2 pt-6 border-t border-white/10">
        <a href="/login"
            class="block w-full text-center py-3 rounded text-white bg-white/5 border border-white/10 font-semibold text-sm">Log In</a>
        <a href="/signup"
            class="block w-full text-center py-3 rounded text-black bg-[#FFD700] font-heading font-bold text-sm uppercase tracking-wider">Sign Up</a>
    </div>
</div>
