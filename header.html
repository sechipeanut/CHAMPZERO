<header id="main-header"
    class="sticky top-0 z-[1000] bg-black/95 backdrop-blur-md border-b border-white/5 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-18 flex justify-between items-center py-4 relative">
        
        <!-- BRAND IDENTITY -->
        <a href="/" class="flex items-center gap-2.5 group shrink-0 z-10">
            <img src="pictures/cz_logo.png" 
                 alt="ChampZero Logo" 
                 class="w-7 h-7 object-contain">
            <div class="flex items-center gap-1.5">
                <span class="font-heading font-bold text-base tracking-tight text-white group-hover:text-[#FFD700] transition-colors">ChampZero</span>
                <span class="font-mono-tag bg-[#FFD700] text-black text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">
                    Beta
                </span>
            </div>
        </a>

        <!-- DESKTOP NAV -->
        <nav class="hidden md:flex items-center gap-4 lg:gap-6 xl:gap-8 text-xs font-semibold uppercase tracking-wider text-neutral-400 md:absolute md:left-1/2 md:-translate-x-1/2">
            <a href="/"          class="nav-link hover:text-white transition-colors">Home</a>
            <a href="/tournaments" class="nav-link hover:text-white transition-colors">Tournaments</a>
            <a href="/events"    class="nav-link hover:text-white transition-colors">Events</a>
            <a href="/teams"     class="nav-link hover:text-white transition-colors">Teams</a>
            <a href="/rising"    class="nav-link hover:text-white transition-colors">Rising Champ</a>
            <a href="/partners"  class="nav-link hover:text-white transition-colors">Partners</a>
        </nav>


        <!-- AUTH CONTROLS -->
        <div class="flex items-center gap-3 shrink-0 z-10">
            <div id="auth-controls-wrapper" class="flex items-center gap-2 shrink-0">
                    <div id="auth-controls" class="flex items-center gap-2 shrink-0"></div>
                    <script>
                        (function(){
                            try {
                                var el = document.getElementById('auth-controls');
                                if (!el) return;
                                var raw = localStorage.getItem('cz_auth_cache');
                                if (raw) {
                                    var u = JSON.parse(raw);
                                    if (u && (u.uid || u.displayName || u.email)) {
                                        var name = u.ign || u.displayName || (u.email ? u.email.split('@')[0] : 'Champion');
                                        var avatar = u.avatar || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=111116&color=FFD700');
                                        var isSup = Boolean(u.isSupporter);
                                        var tier = String(u.supporterTier || 'bronze').toLowerCase();
                                        var verIcon = u.emailVerified ? '<span title="Verified User" class="text-emerald-400 inline-flex items-center"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>' : '';
                                        el.innerHTML = '<div class="relative profile-dropdown-container flex items-center"><button class="flex items-center gap-2 p-1 pr-2.5 rounded-full bg-[#111116]/90 hover:bg-[#181822] border border-white/15 hover:border-[#FFD700]/50 transition-all cursor-pointer group shadow-sm"><img src="' + avatar + '" class="w-8 h-8 rounded-full ' + (isSup ? (tier === 'gold' ? 'border-2 border-[#FFD700]' : 'border-2 border-slate-300') : 'border border-white/20') + ' object-cover shrink-0"><span class="text-xs font-heading font-bold text-white max-w-[85px] truncate hidden sm:inline-block">' + name + '</span>' + verIcon + '<svg class="w-3.5 h-3.5 text-neutral-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button></div>';
                                        return;
                                    }
                                }
                                el.innerHTML = '<a href="/login" class="text-xs font-semibold px-3 py-1.5 text-neutral-300 hover:text-white transition-colors">Log In</a><a href="/signup" class="text-xs font-heading font-bold uppercase tracking-wider px-3.5 py-1.5 rounded-lg bg-[#FFD700] text-black hover:bg-[#FFF099] transition-all shadow-sm">Sign Up</a>';
                            } catch(e){}
                        })();
                    </script>
                </div>
                <button id="mobile-menu-button" aria-label="Toggle navigation menu"
                class="md:hidden p-2 rounded text-neutral-400 hover:text-white hover:bg-white/5 border border-white/10 cursor-pointer pointer-events-auto transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<div id="mobile-menu"
    class="hidden md:hidden fixed inset-0 bg-black/98 backdrop-blur-2xl z-[2000] p-6 transition-all duration-300 flex flex-col justify-between">
    <div>
        <div class="flex justify-between items-center pb-5 border-b border-white/10">
            <div class="flex items-center gap-2.5">
                <img src="pictures/cz_logo.png" class="w-7 h-7 object-contain" alt="Logo">
                <span class="font-heading font-bold text-white text-base">ChampZero</span>
            </div>
            <button id="close-mobile-menu" class="p-2 text-neutral-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="flex flex-col gap-4 text-base font-semibold mt-8">
            <a href="/"            class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Home</a>
            <a href="/tournaments" class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Tournaments</a>
            <a href="/events"      class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Events</a>
            <a href="/teams"       class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Teams</a>
            <a href="/rising"      class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Rising Champ</a>
            <a href="/partners"    class="text-neutral-400 hover:text-white py-2 border-b border-white/5">Partners</a>
        </nav>
    </div>
    <div class="space-y-2 pt-6 border-t border-white/10">
        <a href="/login"
            class="block w-full text-center py-3 rounded text-white bg-white/5 border border-white/10 font-semibold text-sm">Log In</a>
        <a href="/signup"
            class="block w-full text-center py-3 rounded text-black bg-[#FFD700] font-heading font-bold text-sm uppercase tracking-wider">Sign Up</a>
    </div>
</div>
